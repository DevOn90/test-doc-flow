name: Export ODS to CSV

on:
    push:
        paths:
            - "**/*.ods"
    pull_request:
        paths:
            - "**/*.ods"

jobs:
    export:
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v4  # pin version
              with:
                lfs: true
                ref: ${{ github.head_ref || github.ref_name }}
                
            - name: Install Python dependencies
              run: |
                python -m pip install --upgrade pip
                python -m pip install pandas odfpy

            - name: Convert ODS to CSV
              shell: bash
              run: |
                # Enable strict error handling
                set -euo pipefail

                python - <<'PY'
                from pathlib import Path
                import re

                import pandas as pd

                def sanitize_sheet_name(name: str) -> str:
                    safe = re.sub(r"[^A-Za-z0-9._-]+", "-", name.strip()).strip("-")
                    return safe or "sheet"

                ods_files = sorted(Path(".").rglob("*.ods"))
                for ods in ods_files:
                    base = ods.with_suffix("")
                    export_dir = base.parent / "exportsCSV"
                    export_dir.mkdir(exist_ok=True)

                    # Remove old exports for this ODS file so renamed/removed sheets do not leave stale CSVs.
                    for stale in export_dir.glob(f"{base.name}_*.csv"):
                        stale.unlink()

                    # Remove legacy exports from the old layout.
                    legacy_base = base.with_suffix(".csv")
                    if legacy_base.exists():
                        legacy_base.unlink()
                    for stale in base.parent.glob(f"{base.name}__*.csv"):
                        stale.unlink()

                    sheets = pd.read_excel(ods, engine="odf", sheet_name=None)
                    if not sheets:
                        continue

                    for sheet_name, df in sheets.items():
                        safe_sheet = sanitize_sheet_name(sheet_name)
                        out = export_dir / f"{base.name}_{safe_sheet}.csv"
                        df.to_csv(out, index=False)
                        print(f"Converted {ods} [{sheet_name}] -> {out}")
                PY

            - name: Commit generated CSV
              shell: bash
              run: |
                # Enable strict error handling
                set -euo pipefail
                # Check if there are any changes to commit
                if [[ -n "$(git status --porcelain)" ]]; then

                    # Configure Git user for committing changes
                    git config user.name "github-actions[bot]"
                    
                    # Configure Git user email for committing changes
                    git config user.email "github-actions[bot]@users.noreply.github.com"
                    
                    # Add generated CSV files and deletions from the export folders.
                    git add -A -- ':(glob)**/exportsCSV/*.csv' '*.ods' || true

                    # Commit the changes with a message indicating that the CSV files were auto-generated from ODS files
                    git commit -m "chore: auto-generate CSV from ODS"

                    # Determine the branch name to push to. 
                    # If the workflow is triggered by a pull request, 
                    # use the head reference; otherwise, use the current branch name.
                    BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
                    
                    # Push the committed changes to the determined branch on the origin remote.
                    git push origin "HEAD:${BRANCH}"
                fi