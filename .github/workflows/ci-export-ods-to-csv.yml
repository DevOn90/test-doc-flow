name: Export ODS to CSV

on:
    push:
        paths:
            - "**/*.ods"
    pull_request:
        paths:
            - "**/*.ods"

jobs:
    export:
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v4  # pin version
              with:
                lfs: true
                
            - name: Install Python dependencies
              run: |
                python -m pip install --upgrade pip
                python -m pip install pandas odfpy

            - name: Convert ODS to CSV
              shell: bash
              run: |
                # Enable strict error handling
                set -euo pipefail

                python - <<'PY'
                from pathlib import Path
                import re

                import pandas as pd

                def sanitize_sheet_name(name: str, index: int) -> str:
                    safe = re.sub(r"[^A-Za-z0-9._-]+", "-", name.strip()).strip("-")
                    return safe or f"sheet-{index}"

                ods_files = sorted(Path(".").rglob("*.ods"))
                for ods in ods_files:
                    base = ods.with_suffix("")
                    # Remove old multi-sheet exports to avoid stale files after sheet renames/removals.
                    for stale in base.parent.glob(f"{base.name}__*.csv"):
                        stale.unlink()

                    sheets = pd.read_excel(ods, engine="odf", sheet_name=None)
                    if not sheets:
                        continue

                    if len(sheets) == 1:
                        (_, df), = sheets.items()
                        out = base.with_suffix(".csv")
                        df.to_csv(out, index=False)
                        print(f"Converted {ods} -> {out}")
                        continue

                    first_out = base.with_suffix(".csv")
                    for idx, (sheet_name, df) in enumerate(sheets.items(), start=1):
                        safe_sheet = sanitize_sheet_name(sheet_name, idx)
                        out = base.parent / f"{base.name}__{idx:02d}_{safe_sheet}.csv"
                        df.to_csv(out, index=False)
                        print(f"Converted {ods} [{sheet_name}] -> {out}")

                        # Keep a stable compatibility file for tools expecting <name>.csv.
                        if idx == 1:
                            df.to_csv(first_out, index=False)
                            print(f"Updated compatibility CSV {first_out} (first sheet)")
                PY

            - name: Commit generated CSV
              run: |
                # Enable strict error handling
                set -euo pipefail
                # Check if there are any changes to commit
                if [[ -n "$(git status --porcelain)" ]]; then

                    # Configure Git user for committing changes
                    git config user.name "github-actions[bot]"
                    
                    # Configure Git user email for committing changes
                    git config user.email "github-actions[bot]@users.noreply.github.com"
                    
                    # Add all CSV files to the staging area recursively.
                    git add -A -- '*.csv' || true

                    # Commit the changes with a message indicating that the CSV files were auto-generated from ODS files
                    git commit -m "chore: auto-generate CSV from ODS"

                    # Push the changes to the remote repository
                    git push
                fi