name: Check Git Hook Path Contract

on:
  workflow_call:

jobs:
  check-githook-path:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4  # pin version

      - name: Validate core.hooksPath
        shell: bash
        run: |
          set -euo pipefail
          HOOKS_PATH="$(git config core.hooksPath 2>/dev/null || true)"
          if [[ "${HOOKS_PATH}" != ".githooks" ]]; then
            echo "ERROR: core.hooksPath is not set to .githooks"
            echo "Set it in your local repository before committing:"
            echo "  git config core.hooksPath .githooks"
            exit 1
          fi

          echo "core.hooksPath is correctly set to .githooks."